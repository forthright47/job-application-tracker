<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style>
        *{
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] w-[80%] mx-auto">
    <header class="mt-10">
        <h1 class="text-4xl font-semibold text-[#002C5C]">Job Application Tracker</h1>
        <div class="grid grid-cols-3 gap-4 mt-6">
            <div class="bg-white border border-gray-200 p-5 rounded-xl">
                <p class="text-[#323B49]">Total</p>
                <p id="total-count" class="text-[#002C5C] text-2xl font-bold">0</p>
            </div>
            <div class="bg-white border border-gray-200 p-5 rounded-xl">
                <p class="text-[#323B49]">Interview</p>
                <p id="interview-count" class="text-[#10B981] text-2xl font-bold">0</p>
            </div>
            <div class="bg-white border border-gray-200 p-5 rounded-xl">
                <p class="text-[#323B49]">Rejected</p>
                <p id="rejected-count" class="text-[#EF4444] text-2xl font-bold">0</p>
            </div>
        </div>
    </header>
    <hr class="text-gray-200 my-6">

    <main>
        <h3 class="text-[#002C5C] text-2xl font-semibold">Available Jobs</h3>
        <div class="flex gap-4 mt-4">
            <button id="all-filter-btn" class="bg-blue-400 px-9 py-2 rounded-lg text-white text-sm">All</button>
            <button id="interview-filter-btn" class="bg-white border border-gray-200 px-6 py-2 rounded-lg text-sm text-gray-500">Interview</button>
            <button id="rejected-filter-btn" class="bg-white border border-gray-200 px-6 py-2 rounded-lg text-sm text-gray-500">Rejected</button>
        </div>
    </main>
</body>
</html>
